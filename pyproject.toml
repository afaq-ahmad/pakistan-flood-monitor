[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pakistan-flood-monitor"
version = "0.1.0"
description = "Satellite-driven Pakistan river flood monitoring and breach detection framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Flood Intelligence Team"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "geoalchemy2>=0.15",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "xarray>=2024.1",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "pyarrow>=16.0",
  "pystac-client>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.35"]
ml = ["xgboost>=2.0", "lightgbm>=4.3"]
dl = ["torch>=2.2", "segmentation-models-pytorch>=0.3"]
workflow = ["prefect>=2.16", "dask>=2024.2"]

[project.scripts]
flood-monitor = "pakistan_flood_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
