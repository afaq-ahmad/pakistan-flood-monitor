name: Canonical offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_MODE: test
      DATABASE_URL: sqlite:///${{ runner.temp }}/flood-monitor-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and offline test guard
        run: python -m pip install -e '.[dev]' pytest-socket==0.8.1
      - name: Run focused tests with network sockets disabled
        run: >-
          python -m pytest --disable-socket --allow-unix-socket -q --tb=short
          tests/test_agent_operating_contract.py
          tests/test_authentication_boundary.py
          tests/test_publication_lineage_boundary.py
          tests/test_integrity_summary_regression.py
          tests/test_operational_data_integrity.py
          tests/test_workflow_foundation.py
          tests/test_canonical_runtime_smoke.py
          tests/test_geo_measurements.py
          tests/test_lineage_schema.py
      - name: Compile canonical package
        run: python -m compileall -q src/pakistan_flood_monitor
