name: Offline test suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_MODE: test
      DATABASE_URL: sqlite:///${{ runner.temp }}/flood-monitor-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and offline test guard
        run: python -m pip install -e '.[dev]' pytest-socket==0.8.1
      - name: Run full test suite with network sockets disabled
        run: python -m pytest --disable-socket --allow-unix-socket tests/ -q --tb=short
      - name: Check tests did not change tracked data
        run: git diff --exit-code -- storage data
      - name: Verify SQLite migration round-trip
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/flood-monitor-migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Compile canonical package
        run: python -m compileall -q src/pakistan_flood_monitor
